name: Package release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/release"
          node plugins/package.mjs --archive-out "$RUNNER_TEMP/release" --archive-format tar.gz
          node plugins/package.mjs --archive-out "$RUNNER_TEMP/release" --archive-format zip
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
      - name: Verify packages and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile, zipfile
          root = pathlib.Path.cwd()
          version = json.loads((root / 'package.json').read_text())['version']
          assert version.startswith('0.3.0-alpha.') and all(c.isalnum() or c in '.-' for c in version)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          assets = []
          for host in ('claude-code', 'codex'):
              for fmt in ('tar.gz', 'zip'):
                  name = f'specification-guided-development-{host}-{version}-darwin-arm64.{fmt}'
                  path = output / name
                  with tempfile.TemporaryDirectory() as directory:
                      if fmt == 'tar.gz':
                          subprocess.run(['tar', '-xzf', str(path), '-C', directory], check=True)
                      else:
                          with zipfile.ZipFile(path) as archive:
                              archive.extractall(directory)
                      result = subprocess.run(['node', f'{directory}/scripts/run.mjs', '--version'], capture_output=True, text=True, check=True)
                      assert result.stdout.strip() == version
                  assets.append({'name': name, 'host': host, 'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'platform': 'darwin',
                      'architecture': 'arm64', 'format': fmt})
          sdk = output / f'specification-guided-development-{version}.tgz'
          manifest = {'schema': 'sgd-plugin-release-v1', 'version': version, 'tag': 'v' + version,
              'channel': 'alpha', 'source': {'repository': 'KimSeogyu/specification-guided-development',
              'commit': os.environ['GITHUB_SHA']}, 'build': {'platform': 'darwin', 'architecture': 'arm64'},
              'assets': assets, 'sdk': {'name': sdk.name, 'bytes': sdk.stat().st_size,
              'sha256': hashlib.sha256(sdk.read_bytes()).hexdigest()}}
          (output / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload draft release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" "$RUNNER_TEMP"/release/* --target "$GITHUB_SHA" \
            --draft --prerelease --title "$version" \
            --notes 'Generate TypeScript and Rust domains and TypeScript source checks from TLA+ models. Lean checks finite protocols; native compilers and external effects remain trust boundaries.'
