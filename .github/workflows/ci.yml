name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt
          echo 'RUSTUP_TOOLCHAIN=1.92.0' >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/fetch-tlc.mjs
      - name: Install pinned Lean for domain proof integration
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "SGD_LEAN_BINARY=$RUNNER_TEMP/lean-4.35.0-linux/bin/lean" >> "$GITHUB_ENV"
      - run: npm run check
        env:
          TLA2TOOLS_JAR: .runtime/tla2tools.jar
      - run: npm run build
      - run: npm run proofs:check
      - run: npm run verify:ingestion
      - run: npm run plugins:package
      - run: npm run plugins:verify
