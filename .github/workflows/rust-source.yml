name: native-rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Rust helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path tools/rust-bindings/Cargo.toml
      - run: cargo test --locked --manifest-path tools/rust-bindings/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/rust-bindings/Cargo.toml --all-targets -- -D warnings
